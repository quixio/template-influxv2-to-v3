name: InfluxDB V3 Data Sink
language: python
variables:
  - name: INFLUXDB_TAG_KEYS
    inputType: FreeText
    description: The names of tags to look for in the incoming data and retain when writing to InfluxDB V3
    defaultValue: "['tag0','tag1','tag2']"
    required: false
  - name: INFLUXDB_HOST
    inputType: FreeText
    description: ''
    defaultValue: https://us-east-1-1.aws.cloud2.influxdata.com
    required: true
  - name: INFLUXDB_ORG
    inputType: FreeText
    description: ''
    defaultValue: ContentSquad
    required: true
  - name: INFLUXDB_DATABASE
    inputType: FreeText
    description: ''
    defaultValue: data_load_testing
    required: false
  - name: input
    inputType: InputTopic
    description: ''
    defaultValue: influxv2-data
    required: false
  - name: INFLUXDB_TOKEN
    inputType: Secret
    description: ''
    defaultValue: influx_db3
    required: true
  - name: INFLUXDB_FIELD_KEYS
    inputType: FreeText
    description: The names of the fields to look for in the incoming data and retain when writing to InfluxDB V3
    defaultValue: '[table, v0, v01, v010, v011, v012, v013, v014, v015, v016, v017, v018, v019, v02, v020, v021, v022, v023, v024, v025, v026, v027, v028, v029, v03, v030, v031, v032, v033, v034, v035, v036, v037, v038, v039, v04, v040, v041, v042, v043, v044, v045, v046, v047, v048, v049, v05, v050, v051, v052, v053, v054, v055, v056, v057, v058, v059, v06, v060, v061, v062, v063, v064, v065, v066, v067, v068, v069, v07, v070, v071, v072, v073, v074, v075, v076, v077, v078, v079, v08, v080, v081, v082, v083, v084, v085, v086, v087, v088, v089, v09, v090, v091, v092, v093, v094, v095, v096, v097, v098, v099]'
    required: true
  - name: CONSUMER_GROUP_NAME
    inputType: FreeText
    description: ''
    defaultValue: influxdb-data-writer
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
