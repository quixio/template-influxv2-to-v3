# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: InfluxDB V2 Data Source
    application: InfluxDB V2 Data Source
    deploymentType: Service
    version: latest
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    desiredStatus: Stopped
    variables:
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write into
        required: true
        value: influxv2-data
      - name: INFLUXDB_ORG
        inputType: FreeText
        description: ''
        required: true
        value: Quixtest
      - name: INFLUXDB_HOST
        inputType: FreeText
        description: ''
        required: true
        value: https://3471-92-116-231-40.ngrok-free.app/
      - name: task_interval
        inputType: FreeText
        description: ''
        required: false
        value: 1y
      - name: INFLUXDB_BUCKET
        inputType: FreeText
        description: ''
        required: true
        value: testbucket2
      - name: INFLUXDB_TOKEN
        inputType: Secret
        description: ''
        required: true
        secretKey: influx_db
  - name: InfluxDB V3 Data Sink
    application: InfluxDB V3 Data Sink
    deploymentType: Service
    version: latest
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    desiredStatus: Stopped
    variables:
      - name: INFLUXDB_TAG_KEYS
        inputType: FreeText
        description: The names of tags to look for in the incoming data and retain when writing to InfluxDB V3
        required: false
        value: "['tag0','tag1','tag2']"
      - name: INFLUXDB_HOST
        inputType: FreeText
        description: ''
        required: true
        value: https://us-east-1-1.aws.cloud2.influxdata.com
      - name: INFLUXDB_ORG
        inputType: FreeText
        description: ''
        required: true
        value: ContentSquad
      - name: INFLUXDB_DATABASE
        inputType: FreeText
        description: ''
        required: false
        value: data_load_testing
      - name: input
        inputType: InputTopic
        description: ''
        required: false
        value: influxv2-data
      - name: INFLUXDB_TOKEN
        inputType: Secret
        description: ''
        required: true
        secretKey: influx_db3
      - name: INFLUXDB_FIELD_KEYS
        inputType: FreeText
        description: The names of the fields to look for in the incoming data and retain when writing to InfluxDB V3
        required: true
        value: '[table, v0, v01, v010, v011, v012, v013, v014, v015, v016, v017, v018, v019, v02, v020, v021, v022, v023, v024, v025, v026, v027, v028, v029, v03, v030, v031, v032, v033, v034, v035, v036, v037, v038, v039, v04, v040, v041, v042, v043, v044, v045, v046, v047, v048, v049, v05, v050, v051, v052, v053, v054, v055, v056, v057, v058, v059, v06, v060, v061, v062, v063, v064, v065, v066, v067, v068, v069, v07, v070, v071, v072, v073, v074, v075, v076, v077, v078, v079, v08, v080, v081, v082, v083, v084, v085, v086, v087, v088, v089, v09, v090, v091, v092, v093, v094, v095, v096, v097, v098, v099]'
      - name: CONSUMER_GROUP_NAME
        inputType: FreeText
        description: ''
        required: false
        value: influxdb-data-writer

# This section describes the Topics of the data pipeline
topics:
  - name: influxv2-data
    persisted: false
    configuration:
      partitions: 1
      replicationFactor: 2
      retentionInMinutes: 1440
      retentionInBytes: 52428800
